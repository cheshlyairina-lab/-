const app=document.querySelector('#app'); let step=0,email='',answers={},startedAt=Date.now(),submission=null,sending=false;
const stage=new URLSearchParams(location.search).get('stage')==='post'?'post':'pre';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function entry(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Практика ИИ / ${stage==='pre'?'до обучения':'после обучения'}</span><h1>Твой<br><span style="color:var(--purple)">AI-код.</span></h1><p>Как ИИ уже работает с тобой? 12 вопросов, пять независимых режимов и один следующий шаг.</p><p class="muted">Это карта твоих действий, а не оценка способностей. Около 5–7 минут.</p></div><div class="art" aria-hidden="true">${AICode.modes.map(m=>`<span class="glyph">${m[1]}</span>`).join('')}</div></section><form id="entry" class="panel entry"><label for="email">Только твой email</label><input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"><label class="honeypot" aria-hidden="true">Сайт<input id="website" type="text" tabindex="-1" autocomplete="off"></label><label class="consent"><input id="consent" type="checkbox" required><span>Согласен / согласна на передачу email и ответов Ренситету через Google для анализа обучения. Email не попадёт на карточку JPG.</span></label><details><summary>Как используются данные</summary><p>Email, ответы, профиль и дата передаются в Google Таблицу организатора. Не указывай в свободном тексте имена клиентов, персональные данные третьих лиц или коммерческие секреты. Данные в браузере остаются только до закрытия или обновления страницы. Срок хранения и контакт для удаления уточни у организатора до прохождения. ${CONFIG.privacyContact}</p></details><p class="error" id="error" role="alert"></p><button class="primary">Начать →</button></form>`;document.querySelector('#entry').onsubmit=e=>{e.preventDefault();if(document.querySelector('#website').value)return;email=document.querySelector('#email').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.querySelector('#error').textContent='Проверь email.';return;}startedAt=Date.now();step=1;render();};}
function selected(i){const a=answers['q'+step];return step===1||step===7?a===i:(a||[]).includes(i);}
function choices(q){const icons=step===2?['✦','◈','Я','G','◇','▧','⊕','…','○']:step===4?['✎','⌕','▥','◷','✧','◇','↗','▧','⬡','○']:[];return q[2].map((t,i)=>`<button type="button" class="choice" data-option="${i}" ${step===1||step===7?`role="radio" aria-checked="${selected(i)}"`:`aria-pressed="${selected(i)}"`}><span class="num">${icons[i]||String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');}
function render(focus=true){const q=questions[step-1];app.innerHTML=`<div class="toolbar"><span class="eyebrow">${String(step).padStart(2,'0')} / 12 · ${step>=5&&step<=9?'действия':step===12?'практика':'контекст'}</span><div class="symbols" aria-label="Символы режимов постепенно проявляются">${AICode.modes.map((m,i)=>`<span class="${step>i*2+1?'revealed':''}" title="${m[2]}">${m[1]}</span>`).join('')}</div></div><div class="progress" role="progressbar" aria-label="Прохождение" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${step}"><span style="width:${step/12*100}%"></span></div><section class="question ${q[3]}"><h2 id="title" tabindex="-1">${q[0]}</h2><p class="hint">${q[1]}</p>${questionBody(q)}<p class="error" id="error" role="alert"></p><div class="toolbar"><button id="back" class="secondary">← Назад</button><button id="next" class="primary">${step===12?'Получить мой AI-код':'Дальше →'}</button></div></section>`;
app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.option)));
const back=app.querySelector('#back');back.onclick=()=>{if(step===1){entry();return;}step--;render();};app.querySelector('#next').onclick=()=>{const a=answers['q'+step];if(a===undefined||(Array.isArray(a)&&!a.length)||(typeof a==='string'&&!a.trim())){app.querySelector('#error').textContent='Добавь ответ, чтобы продолжить.';return;}if(step<12){step++;render();}else showResult();};
if(step===3){const input=app.querySelector('#learning');if(input)input.oninput=()=>answers.q3detail=input.value;}
if(step===12){app.querySelector('#prompt').oninput=e=>{answers.q12=e.target.value;app.querySelector('#count').textContent=e.target.value.length+' / 3000';};}
if(step===1){const d=app.querySelector('.dial');d.onclick=e=>{const r=d.getBoundingClientRect();let angle=(Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI+450)%360;choose(Math.floor(angle/72));};d.onkeydown=e=>{if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();choose(e.key==='Home'?0:e.key==='End'?4:((answers.q1??0)+(['ArrowRight','ArrowUp'].includes(e.key)?1:4))%5);}};}
if(focus)app.querySelector('#title').focus();}
function questionBody(q){if(step===12)return `<div class="practice-chat"><div class="chat-heading"><span class="chat-dot"></span> Мини-практикум / твой запрос</div><div class="bubble">Завтра встреча с клиентом или партнёром. Что ты попросишь у ИИ?<br><strong>Напиши так, как написал бы сейчас.</strong></div><div class="compose"><label for="prompt">Твоё сообщение ИИ</label><textarea id="prompt" maxlength="3000" placeholder="Мне предстоит встреча… Помоги…">${escapeHTML(answers.q12||'')}</textarea><div class="counter" id="count">${(answers.q12||'').length} / 3000</div></div><p class="hint">Это твой образец практики. ИИ не отвечает на него и не оценивает его.</p></div>`;let c=`<div class="${step===3?'route':'choices'}" ${step===1||step===7?'role="radiogroup" aria-label="Выбор одного ответа"':''}>${choices(q)}</div>`;if(step===1)c=`<div class="dial" style="--sector:${answers.q1??0};--chosen:${answers.q1===undefined?0:1}" role="slider" tabindex="0" aria-label="Частота использования ИИ" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${answers.q1??0}" aria-valuetext="${answers.q1===undefined?'Ответ ещё не выбран':q[2][answers.q1]}"><div class="needle" style="--angle:${(answers.q1??0)*72+36}deg"></div><div class="dial-core"><span class="dial-label">${answers.q1===undefined?'Твой ритм':String(answers.q1+1).padStart(2,'0')}</span><span>${answers.q1===undefined?'Выбери сектор':q[2][answers.q1]}</span></div></div>`+c;
if(step===4){const picks=(answers.q4||[]).filter(i=>i<9);c=`<div class="universe"><div class="orbit" aria-label="Твоя AI-вселенная"><span class="center">Я + ИИ</span>${picks.map(i=>{const angle=i*2*Math.PI/9;return `<button class="planet" data-option="${i}" aria-label="Удалить: ${q[2][i]}" style="--x:${Math.sin(angle)*125}px;--y:${-Math.cos(angle)*125}px"><span>${['✎','⌕','▥','◷','✧','◇','↗','▧','⬡'][i]}</span>${q[2][i]}</button>`;}).join('')}</div><span class="eyebrow">Добавь задачи · ${picks.length} / 9</span>${c}</div>`;}
if(step===5||step===8)c=radialBuilder(q);
if(step===6)c=`<div class="assembly" aria-label="Твой конвейер"><div class="flow-source">▤<br><strong>Заметки со встречи</strong></div><div class="flow-track">${(answers.q6||[]).filter(i=>i<5).map(i=>`<span class="flow-link" aria-hidden="true">→</span><span class="flow-block">${q[2][i]}</span>`).join('')||'<span class="assembly-empty">Выбери действия — они соединятся в конвейер</span>'}</div></div>`+c;
if(step===9)c=`<div class="system-builder"><div class="tower" aria-label="Собранная система">${(answers.q9||[]).filter(i=>i<5).sort((a,b)=>b-a).map(i=>`<div class="tower-block" style="--part:${i}"><span>${['▤','▦','⬡','⇢','⚙'][i]}</span>${q[2][i]}</div>`).join('')||'<span class="assembly-empty">Выбери детали для своей системы</span>'}<div class="tower-base">Моя AI-система</div></div>${c}</div>`;
if(step===10||step===11){const a=answers['q'+step]||[];c=`<div class="focus-layout">${c}<aside class="selection-panel ${step===10?'obstacles':'focus-panel'}"><span class="eyebrow">${step===10?'Мои препятствия':'Мой фокус'}</span><div class="selection-stack">${a.map((i,n)=>`<button class="selected-card" data-option="${i}" style="--order:${n}" aria-label="Убрать: ${q[2][i]}"><span>${step===10?'↗':['01','02','03'][n]}</span>${q[2][i]}<small>×</small></button>`).join('')||'<p class="assembly-empty">Здесь появятся твои выбранные '+(step===10?'барьеры':'цели')+'</p>'}</div><span class="hint">${a.length} / 3 · Нажми, чтобы убрать</span></aside></div>`;}
if(step===7){const response=['Можно начать с простого: назови цель встречи и попроси три уточняющих вопроса.','Попробую другой вариант. Что именно тебе не подошло?','Теперь учту цель, контекст встречи и критерии хорошего результата.','Сравним несколько подходов: какие плюсы, риски и допущения у каждого?','Разделим факты и гипотезы, проверим источники и сопоставим ответ с критериями.'];c=`<div class="chat"><div class="bubble"><span class="chat-speaker">ИИ / пример ситуации</span>«Вот общий план встречи».<br>Ты видишь: ответ слишком общий и не помогает.</div>${c}${answers.q7===undefined?'':`<div class="chat-followup" role="status"><span class="chat-speaker">Продолжение сценария / иллюстрация</span>${response[answers.q7]}</div>`}</div>`;}
if(step===3&&(answers.q3||[]).some(i=>i>=3&&i<=5))c+=`<div class="extra"><label for="learning">Где проходило организованное обучение? <span class="muted">Необязательно</span></label><input id="learning" type="text" maxlength="300" value="${escapeHTML(answers.q3detail||'')}"></div>`;return c;}
function radialBuilder(q){const isRole=step===8,a=answers['q'+step]||[],symbols=isRole?['✦','?','◇','↔','◈']:['?','▤','↔','⌕','↻'];let lines='';for(let i=0;i<5;i++){const t=(i*72-90)*Math.PI/180;lines+=`<line x1="300" y1="240" x2="${300+Math.cos(t)*205}" y2="${240+Math.sin(t)*175}" class="${a.includes(i)?'connected':''}"/>`;}
return `<div class="radial-board ${isRole?'role-board':'kit-board'}"><svg viewBox="0 0 600 480" aria-hidden="true">${lines}</svg><div class="radial-center">${isRole?'✦':'▣'}<strong>${isRole?'ИИ':'Моя подготовка'}</strong><span>${a.filter(i=>i<5).length} / 5</span></div>${q[2].slice(0,5).map((t,i)=>{const angle=(i*72-90)*Math.PI/180;return `<button type="button" class="radial-node" data-option="${i}" aria-pressed="${a.includes(i)}" style="--rx:${50+Math.cos(angle)*34}%;--ry:${50+Math.sin(angle)*36}%"><span class="node-symbol">${symbols[i]}</span><span>${t}</span></button>`;}).join('')}</div><button class="choice none-choice" data-option="5" aria-pressed="${a.includes(5)}">Ничего из этого</button>`;}
function choose(i){const key='q'+step;const oldFocus=document.activeElement?.dataset.option;const wasChoice=document.activeElement?.classList.contains('choice');if(step===1||step===7)answers[key]=i;else{let a=answers[key]||[];const none=[2,3,4,5,6,8,9,10].includes(step)?questions[step-1][2].length-1:-1;if(a.includes(i))a=a.filter(v=>v!==i);else if(i===none)a=[i];else{a=a.filter(v=>v!==none);if((step===10||step===11)&&a.length>=3){app.querySelector('#error').textContent='Можно выбрать максимум три варианта.';return;}a=[...a,i];}answers[key]=a;if(step===3&&!a.some(v=>v>=3&&v<=5))delete answers.q3detail;}render(false);if(oldFocus!==undefined)app.querySelector(`${step===4&&wasChoice?".choices ":""}[data-option="${oldFocus}"]`)?.focus();else if(step===1)app.querySelector('.dial').focus();}
function showResult(){const result=AICode.calculate(answers);submission={requestId:crypto.randomUUID(),email,stage,version:CONFIG.version,answers:JSON.parse(JSON.stringify(answers)),profile:result,consent:true,elapsedMs:Date.now()-startedAt,website:''};app.innerHTML=`<section><div class="result-top"><div><span class="eyebrow">Твой AI-код / Ренситет</span><h2 tabindex="-1" id="title">Пять граней твоей практики.</h2></div><div class="result-code" aria-hidden="true">⚡ ✦ ◇ ◈ ⬡</div></div><p>${result.leaders.length?'Ведущие режимы: '+result.leaders.map(id=>AICode.modes.find(m=>m[0]===id)[2]).join(' · '):'Ведущие режимы пока не проявились — в Q5–Q9 нет действий с баллами.'}</p><div class="indicators">${AICode.modes.map((m,i)=>`<article class="indicator"><span class="icon">${m[1]}</span><h3>${m[2]}</h3><p>${m[3]}</p><strong>${result.values[i]}%</strong><div class="bar" aria-label="${m[2]}: ${result.values[i]} процентов"><span style="width:${result.values[i]}%"></span></div></article>`).join('')}</div><p class="hint">Каждый индикатор отражает отмеченные действия относительно собственного максимума. Проценты не складываются в общую оценку. Режимы могут сочетаться.</p><div class="panel recommend"><span class="eyebrow">Твой следующий шаг</span><p>${escapeHTML(result.recommendation)}</p></div><div class="result-actions"><button class="primary" id="jpg">Скачать JPG</button><button class="secondary" id="edit">Изменить ответы</button><button class="secondary" id="retry">Повторить отправку</button></div><p class="status" id="saveStatus" role="status">Результат показан, сохранение требует проверки.</p><p class="error" id="jpgError" role="alert"></p><div id="jpgOutput"></div></section>`;app.querySelector('#title').focus();app.querySelector('#jpg').onclick=()=>downloadJPG(result);app.querySelector('#edit').onclick=()=>{step=12;render();};app.querySelector('#retry').onclick=()=>send(submission);send(submission);}
async function send(payload){if(sending)return;const target=app.querySelector('#saveStatus'),retry=app.querySelector('#retry');if(new URLSearchParams(location.search).get('preview')==='1'){target.textContent='Результат показан. Режим проверки: ответы не отправляются.';retry.disabled=true;return;}sending=true;retry.disabled=true;target.textContent='Результат показан. Отправляем ответы; сохранение требует проверки.';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),signal:controller.signal});target.textContent='Результат показан, сохранение требует проверки. Браузер не получает подтверждение записи; организатор проверяет Google Таблицу.';}catch(e){target.textContent='Результат показан. Подтвердить сохранение не удалось. Проверь соединение и повтори отправку.';}finally{clearTimeout(timer);sending=false;retry.disabled=false;}}
function resultCanvas(result){const c=document.createElement('canvas');c.width=1600;c.height=1500;const x=c.getContext('2d');x.fillStyle='#f7f5fb';x.fillRect(0,0,c.width,c.height);x.fillStyle='#400080';x.font='600 24px Arial';if(brandImage.complete&&brandImage.naturalWidth)x.drawImage(brandImage,90,45,280,58); x.fillText('ТВОЙ AI-КОД',1010,85);x.font='700 88px Arial';x.fillText('Пять граней',90,205);x.fillStyle='#242033';x.fillText('твоей практики.',90,310);x.font='25px Arial';wrap(x,result.leaders.length?'Ведущие режимы: '+result.leaders.map(id=>AICode.modes.find(m=>m[0]===id)[2]).join(' · '):'Ведущие режимы пока не проявились',90,385,1400,36);AICode.modes.forEach((m,i)=>{const y=470+i*113;x.fillStyle='#242033';x.font='600 32px Arial';x.fillText(m[2],90,y);x.font='25px Arial';x.fillText(result.values[i]+'%',1390,y);x.fillStyle='#e3dbf1';x.fillRect(90,y+23,1400,13);x.fillStyle=['#400080','#8abfe7','#dc8dbd','#9aba47','#a38ae1'][i];x.fillRect(90,y+23,14*result.values[i],13);});x.fillStyle='#dbf68e';x.fillRect(65,1050,1470,295);x.fillStyle='#242033';x.font='600 27px Arial';x.fillText('ТВОЙ СЛЕДУЮЩИЙ ШАГ',90,1100);x.font='26px Arial';wrap(x,result.recommendation,90,1150,1390,38);x.font='21px Arial';x.fillStyle='#71697e';x.fillText('Карта действий Q5–Q9 · Независимые режимы · Не оценка способностей',90,1420);return c;}
function wrap(ctx,text,x,y,width,line){let row='';for(const w of text.split(' ')){if(ctx.measureText(row+w).width>width&&row){ctx.fillText(row.trim(),x,y);row='';y+=line;}row+=w+' ';}ctx.fillText(row.trim(),x,y);return y;}
async function downloadJPG(result){try{await brandImage.decode();}catch(e){}const b=app.querySelector('#jpg');b.disabled=true;resultCanvas(result).toBlob(blob=>{b.disabled=false;if(!blob){app.querySelector('#jpgError').textContent='Не удалось создать JPG. Попробуй ещё раз.';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rensitet-my-ai-code.jpg';const old=app.querySelector('#jpgLink');if(old)URL.revokeObjectURL(old.href);a.id='jpgLink';a.className='secondary';a.textContent='Сохранить готовую карточку JPG';const box=app.querySelector('#jpgOutput');box.replaceChildren(a);const preview=document.createElement('img');preview.id='jpgPreview';preview.src=url;preview.alt='Готовая карточка Твой AI-код без email';preview.style.cssText='display:block;width:100%;max-width:800px;margin:25px auto;border-radius:16px';box.append(preview);a.click();},'image/jpeg',.94);}
let rotating=false;
function rotateAt(e){const d=app.querySelector('.dial');if(!d)return;const r=d.getBoundingClientRect();const angle=(Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI+450)%360;const i=Math.floor(angle/72);if(answers.q1!==i)choose(i);}
app.addEventListener('pointerdown',e=>{if(step===1&&e.target.closest('.dial')){rotating=true;app.setPointerCapture(e.pointerId);rotateAt(e);}});
app.addEventListener('pointermove',e=>{if(rotating)rotateAt(e);});
app.addEventListener('pointerup',e=>{rotating=false;if(app.hasPointerCapture(e.pointerId))app.releasePointerCapture(e.pointerId);});
app.addEventListener('pointercancel',()=>rotating=false);
entry();
</script></body></html>
