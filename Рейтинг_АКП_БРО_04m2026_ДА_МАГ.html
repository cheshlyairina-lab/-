<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рейтинг АКП/БРО — Апрель 2026</title>
<style>
:root {
  --primary: #330066;
  --dark: #200040;
  --lime: #99ff66;
  --lv1: #f1efff;
  --lv2: #d8d0f0;
  --lv3: #b09fdd;
  --text: #200040;
  --white: #ffffff;
  --gold: #fdeab6;
  --silver: #e8e4f5;
  --bronze: #f0d9c9;
  --radius: 16px;
  --radius-sm: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;background:#f6f4fb;color:var(--text);font-size:14px}
.site-header{background:var(--dark);padding:14px 32px;display:flex;align-items:center;gap:16px}
.logo-text{color:var(--white);font-size:17px;font-weight:700;letter-spacing:-0.03em}
.logo-sub{color:var(--lv3);font-size:11px;margin-top:1px}
.hero{background:var(--primary);padding:24px 32px 22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(153,255,102,0.08);pointer-events:none}
.hero-title{color:var(--white);font-size:22px;font-weight:700;letter-spacing:-0.03em;margin-bottom:4px}
.hero-sub{color:var(--lv3);font-size:13px}
.hero-stats{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.hero-stat{background:rgba(255,255,255,0.08);border-radius:var(--radius-sm);padding:10px 18px}
.hero-stat-val{color:var(--lime);font-size:26px;font-weight:800;line-height:1}
.hero-stat-lbl{color:var(--lv3);font-size:11px;margin-top:3px}
.section-bar{background:var(--white);border-bottom:2px solid var(--lv2);padding:12px 24px;display:flex;gap:8px;align-items:center}
.section-btn{background:var(--lv1);border:2px solid var(--lv2);border-radius:999px;padding:7px 20px;font-size:13px;font-weight:700;color:#666;cursor:pointer;transition:all 0.15s}
.section-btn:hover{border-color:var(--primary);color:var(--primary)}
.section-btn.active{background:var(--primary);border-color:var(--primary);color:var(--white)}
.section-lbl{font-size:12px;color:#999;margin-right:4px;font-weight:600}
.filter-bar{background:#faf9ff;border-bottom:1px solid var(--lv2);padding:8px 24px;gap:8px;align-items:center;flex-wrap:wrap}
.cat-btn{background:var(--white);border:1.5px solid var(--lv2);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;color:#666;cursor:pointer;transition:all 0.15s}
.cat-btn:hover{border-color:var(--primary);color:var(--primary)}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:var(--white)}
.cat-count{font-size:10px;opacity:0.7;margin-left:2px}
.filter-select{border:1.5px solid var(--lv2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--dark);background:var(--white);cursor:pointer;max-width:200px}
.filter-sep{color:#ccc;margin:0 4px}
.method-bar{background:var(--white);border-bottom:1px solid var(--lv2);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.method-chip{background:var(--lv1);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--dark);display:inline-flex;align-items:center;gap:4px}
.method-chip strong{color:var(--primary)}
.method-label{color:#888;font-size:11px;margin-right:2px;font-weight:600}
.tabs-nav{background:var(--white);border-bottom:2px solid var(--lv2);padding:0 20px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:100;scrollbar-width:thin}
.tab-btn{background:none;border:none;cursor:pointer;padding:12px 14px;font-size:12px;font-weight:600;color:#666;white-space:nowrap;border-bottom:3px solid transparent;transition:color 0.15s,border-color 0.15s;margin-bottom:-2px}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.content{padding:20px 28px;max-width:1500px;margin:0 auto}
.panel-title{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:4px;letter-spacing:-0.02em}
.panel-sub{font-size:12px;color:#888;margin-bottom:14px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:0 2px 16px rgba(51,0,102,0.08)}
table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--radius);overflow:hidden}
thead tr{background:var(--primary)}
thead th{color:var(--white);padding:10px 11px;text-align:left;font-size:11px;font-weight:600;white-space:nowrap}
thead th.r{text-align:right}
thead th.c{text-align:center}
tbody tr{border-bottom:1px solid #f0eef8;transition:background 0.1s}
tbody tr:hover{background:#f6f3ff}
tbody td{padding:8px 11px;font-size:12px;vertical-align:middle}
tbody td.r{text-align:right}
tbody td.c{text-align:center}
.person-name{font-weight:600;min-width:130px}
.place{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700}
.gold{background:var(--gold);color:#7a4f00}
.silver{background:var(--silver);color:var(--primary)}
.bronze{background:var(--bronze);color:#7a3500}
.plain{background:var(--lv2);color:var(--dark)}
.score{text-align:center;font-weight:700;white-space:nowrap;padding:4px 6px!important}
.sc-0{color:#bbb}
.sc-low{color:#d97706}
.sc-mid{color:#16a34a}
.sc-high{color:var(--primary)}
.bold-score{font-size:14px;font-weight:800}
.pct{color:#444;white-space:nowrap}
.neg{color:#dc2626}
.pos{color:#16a34a}
.cat-badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.cat-1{background:#e0d6f5;color:#330066}
.cat-2{background:#d6efd6;color:#166534}
.cat-3{background:#fef3c7;color:#92400e}
.lower-note{background:var(--lv1);border-left:4px solid var(--lv3);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 14px;margin-bottom:12px;font-size:12px;color:#555}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555}
.legend-dot{width:12px;height:12px;border-radius:3px}
.row-below{background:rgba(239,68,68,0.05)!important}
.row-below:hover{background:rgba(239,68,68,0.1)!important}
.threshold-sep td{background:rgba(239,68,68,0.08);border-top:2px dashed #ef4444;padding:5px 14px;font-size:11px;color:#dc2626;font-weight:700;letter-spacing:.03em}
.threshold-note{background:rgba(239,68,68,0.05);border:1.5px solid rgba(239,68,68,0.2);border-radius:10px;padding:8px 16px;margin-bottom:12px;font-size:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
</style>
</head>

function fmtPct(v, digits=1) {
  if (v === null || v === undefined) return '—';
  return (v*100).toFixed(digits) + '%';
}
function fmtSign(v, digits=1) {
  if (v === null || v === undefined) return '—';
  const s = (v*100).toFixed(digits);
  return (v >= 0 ? '+' : '') + s + '%';
}
function fmtDZ(v) {
  if (v === null || v === undefined) return '—';
  return `<span class="${v>0?'neg':v<0?'pos':''}">${fmtSign(v)}</span>`;
}
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return Math.round(v).toLocaleString('ru-RU');
}
function fmtMln(v) {
  if (v === null || v === undefined) return '—';
  return (v/1e6).toFixed(1) + ' млн';
}
function fmtRub(v) {
  if (v === null || v === undefined) return '—';
  const abs = Math.abs(v);
  const sign = v < 0 ? '−' : '+';
  return sign + ' ' + (abs/1e6).toFixed(1) + ' млн';
}
function scClass(v) {
  if (v === null || v === undefined || v === 0) return 'sc-0';
  if (v <= 25) return 'sc-low';
  if (v <= 75) return 'sc-mid';
  return 'sc-high';
}
function placeHtml(p) {
  if (!p) return '';
  const cls = p===1?'gold':p===2?'silver':p===3?'bronze':'plain';
  return `<span class="place ${cls}">${p}</span>`;
}
function catBadge(cat) {
  const n = cat.charAt(0);
  return `<span class="cat-badge cat-${n}">${cat}</span>`;
}
function signClass(v) {
  if (v === null) return '';
  return v > 0 ? 'pos' : v < 0 ? 'neg' : '';
}

function getData() {
  let d = DATA[currentSection] || [];
  if (currentSection === 'mag') {
    if (currentCat    !== 'all') d = d.filter(r => r.category === currentCat);
    if (currentOtv    !== 'all') d = d.filter(r => r.otv      === currentOtv);
    if (currentBranch !== 'all') d = d.filter(r => r.branch   === currentBranch);
    if (currentKp     !== 'all') d = d.filter(r => r.kp       === currentKp);
  }
  if (currentSection === 'da') {
    if (currentOtv    !== 'all') d = d.filter(r => r.otv    === currentOtv);
    if (currentBranch !== 'all') d = d.filter(r => r.branch === currentBranch);
  }
  return d;
}

function contextTh() {
  if (currentSection === 'da')  return `<th>Ответственный</th><th>Филиал</th><th>Код КП</th>`;
  if (currentSection === 'mag') return `<th>Категория</th><th>Ответственный</th><th>Филиал</th><th>Код КП</th>`;
  return '';
}
function contextTd(r) {
  if (currentSection === 'da')  return `<td style="color:#666;font-size:11px">${r.otv||''}</td><td style="color:#666;font-size:11px">${r.branch||''}</td><td style="color:#666;font-size:11px;font-family:monospace">${r.kp||''}</td>`;
  if (currentSection === 'mag') return `<td>${catBadge(r.category)}</td><td style="color:#666;font-size:11px">${r.otv||''}</td><td style="color:#666;font-size:11px">${r.branch||''}</td><td style="color:#666;font-size:11px;font-family:monospace">${r.kp||''}</td>`;
  return '';
}

function sortData(d, field, asc) {
  return [...d].sort((a,b) => {
    const av = a[field] ?? (asc ? Infinity : -Infinity);
    const bv = b[field] ?? (asc ? Infinity : -Infinity);
    return asc ? av-bv : bv-av;
  });
}

function renderOverall(d, isMag) {
  const sorted = sortData(d, 'total', false);
  const isOtv = currentSection === 'otv';
  const threshold = isMag ? 50 : (currentSection === 'da' ? 40 : null);

  let scoreFields, scoreLabels;
  if (isMag) {
    scoreFields = ['growth_pct_score','growth_rub_score','lk_score','ifl_score','nonauto_score','prol_score','cov_score','active_score','dz_score'];
    scoreLabels = ['Прирост%','ПриростР','ЛК','ИФЛ','НеАвто','Прол','Охват','Активные','ДЗ'];
  } else {
    scoreFields = ['combr_score','wp_score','growth_score','lk_score','ifl_score','nonauto_score','prol_score','cov_score','active_score','dz_score'];
    scoreLabels = ['CombR','WP','ПриростWP','ЛК','ИФЛ','НеАвто','Прол','Охват','Активные','ДЗ'];
  }
  let th = `<th>#</th><th>Участник</th>` + contextTh();
  scoreLabels.forEach(l => th += `<th class="c">${l}</th>`);
  th += `<th class="c" style="background:rgba(153,255,102,0.15)">Итого</th>`;
  if (isOtv) {
    th += `<th class="c" style="background:rgba(239,68,68,0.15);font-size:10px;line-height:1.3">Неэфф.<br>ДА (&lt;40)</th>`;
    th += `<th class="c" style="background:rgba(239,68,68,0.15);font-size:10px;line-height:1.3">Неэфф.<br>МАГ (&lt;50)</th>`;
  }

  let rows = '';
  let belowCount = 0;
  let sepDone = !threshold;

  sorted.forEach((r, i) => {
    const tot = r.total;
    const isBelow = threshold !== null && tot !== null && tot < threshold;
    if (isBelow) belowCount++;

    if (!sepDone && isBelow) {
      sepDone = true;
      rows += `<tr class="threshold-sep"><td colspan="99">▼ Ниже критерия эффективности — ${threshold} баллов</td></tr>`;
    }

    let td = `<td class="c">${placeHtml(i+1)}</td><td class="person-name">${r.name}</td>` + contextTd(r);
    scoreFields.forEach(f => {
      const v = r[f];
      td += `<td class="score ${scClass(v)}">${v!==null&&v!==undefined?v:'—'}</td>`;
    });
    td += `<td class="score bold-score ${scClass(tot)}" style="background:rgba(153,255,102,0.08)">${tot!==null?tot.toFixed(1):'—'}</td>`;

    if (isOtv) {
      const oName = r.name;
      const ineffDA  = DATA.da.filter(x => x.otv === oName && x.total !== null && x.total < 40).length;
      const totalDA  = DATA.da.filter(x => x.otv === oName).length;
      const ineffMAG = DATA.mag.filter(x => x.otv === oName && x.total !== null && x.total < 50).length;
      const totalMAG = DATA.mag.filter(x => x.otv === oName).length;
      const styleDA  = ineffDA  > 0 ? 'color:#dc2626;font-weight:700' : 'color:#aaa';
      const styleMAG = ineffMAG > 0 ? 'color:#dc2626;font-weight:700' : 'color:#aaa';
      td += `<td class="c" style="${styleDA}">${totalDA > 0 ? ineffDA + '/' + totalDA : '—'}</td>`;
      td += `<td class="c" style="${styleMAG}">${totalMAG > 0 ? ineffMAG + '/' + totalMAG : '—'}</td>`;
    }

    rows += `<tr${isBelow ? ' class="row-below"' : ''}>${td}</tr>`;
  });

  let prefix = '';
  if (threshold !== null) {
    const above = sorted.length - belowCount;
    prefix = `<div class="threshold-note">
      <span style="color:#666">⚡ Критерий эффективности: <strong style="color:#200040">${threshold} баллов</strong></span>
      <span style="color:#16a34a">✓ Выше порога: <strong>${above}</strong></span>
      <span style="color:#dc2626">✗ Ниже порога: <strong>${belowCount}</strong></span>
    </div>`;
  }
  return prefix + `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}


function renderWP(d) {
  const sorted = sortData(d, 'wp_pct', false);
  let th = `<th>#</th><th>Участник</th>` + contextTh();
  th += `<th class="r">Факт ПГ</th><th class="r">План ТГ</th><th class="r">Факт ТГ</th><th class="r">% план</th><th class="c">Балл</th>`;
  let rows = '';
  sorted.forEach((r,i) => {
    let td = `<td class="c">${placeHtml(i+1)}</td><td class="person-name">${r.name}</td>` + contextTd(r);
    td += `<td class="r pct">${fmtMln(r.wp_py)}</td>`;
    td += `<td class="r pct">${fmtMln(r.wp_bud)}</td>`;
    td += `<td class="r pct">${fmtMln(r.wp_act)}</td>`;
    td += `<td class="r pct">${fmtPct(r.wp_pct)}</td>`;
    td += `<td class="score bold-score ${scClass(r.wp_score)}">${r.wp_score!==null?r.wp_score:'—'}</td>`;
    rows += `<tr>${td}</tr>`;
  });
  return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderDZ(d) {
  const sorted = sortData(d, 'dz_score', false);
  let th = `<th>#</th><th>Участник</th>` + contextTh();
  th += `<th class="r">ДЗ М1</th><th class="r">ДЗ М2</th><th class="r">ДЗ М3</th><th class="c">Балл</th>`;
  let rows = '';
  sorted.forEach((r,i) => {
    let td = `<td class="c">${placeHtml(i+1)}</td><td class="person-name">${r.name}</td>` + contextTd(r);
    td += `<td class="r">${fmtDZ(r.dz_m1)}</td><td class="r">${fmtDZ(r.dz_m2)}</td><td class="r">${fmtDZ(r.dz_m3)}</td>`;
    td += `<td class="score bold-score ${scClass(r.dz_score)}">${r.dz_score!==null?r.dz_score:'—'}</td>`;
    rows += `<tr>${td}</tr>`;
  });
  return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderActive(d) {
  const sorted = sortData(d, 'active_score', false);
  let th = `<th>#</th><th>Участник</th>` + contextTh();
  th += `<th class="r">Прирост, шт.</th><th class="c">Балл</th>`;
  let rows = '';
  sorted.forEach((r,i) => {
    let td = `<td class="c">${placeHtml(i+1)}</td><td class="person-name">${r.name}</td>` + contextTd(r);
    const n = r.active_n;
    const nClass = n === null ? '' : n > 0 ? 'pos' : n < 0 ? 'neg' : '';
    td += `<td class="r ${nClass}">${n!==null?(n>0?'+':'')+n:'—'}</td>`;
    td += `<td class="score bold-score ${scClass(r.active_score)}">${r.active_score!==null?r.active_score:'—'}</td>`;
    rows += `<tr>${td}</tr>`;
  });
  return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function getTabConfig(tabId) {
  const isMag = currentSection === 'mag';
  switch(tabId) {
    case 'overall': return null; // special render
    case 'combr': return {
      pctLabel: 'Отклонение CombR', pctField: 'combr_dev', scoreField: 'combr_score',
      sortField: 'combr_dev', sortAsc: true,
      pctFmt: v => v===null?'—':`<span class="${v>0?'neg':'pos'}">${fmtSign(v)}</span>`,
      note: 'Отклонение Combined Ratio от бюджета. Отрицательное значение = лучше бюджета.'
    };
    case 'wp': return null; // special render
    case 'growth': return {
      pctLabel: 'Прирост WP', pctField: isMag?'growth_pct':'growth_pct',
      scoreField: isMag?'growth_pct_score':'growth_score',
      sortField: isMag?'growth_pct':'growth_pct', sortAsc: false,
      pctFmt: v => v===null?'—':`<span class="${v>0?'pos':v<0?'neg':''}">${fmtSign(v)}</span>`,
      note: 'Прирост WP к аналогичному периоду прошлого года.'
    };
    case 'growth_pct': return {
      pctLabel: 'Прирост WP, %', pctField: 'growth_pct', scoreField: 'growth_pct_score',
      sortField: 'growth_pct', sortAsc: false,
      pctFmt: v => v===null?'—':`<span class="${v>0?'pos':v<0?'neg':''}">${fmtSign(v)}</span>`,
      note: 'Прирост премии к аналогичному периоду прошлого года, %.'
    };
    case 'growth_rub': return {
      pctLabel: 'Прирост WP, руб', pctField: 'growth_rub', scoreField: 'growth_rub_score',
      sortField: 'growth_rub', sortAsc: false,
      pctFmt: v => v===null?'—':`<span class="${v>0?'pos':v<0?'neg':''}">${fmtRub(v)}</span>`,
      note: 'Прирост премии к аналогичному периоду прошлого года, руб.'
    };
    case 'lk': return {
      pctLabel: 'Доля продаж в ЛК', pctField: 'lk_pct', scoreField: 'lk_score',
      sortField: 'lk_pct', sortAsc: false,
      pctFmt: fmtPct, note: 'Доля продаж через личный кабинет.'
    };
    case 'ifl': return {
      pctLabel: 'Доля активных ИФЛ', pctField: 'ifl_pct', scoreField: 'ifl_score',
      sortField: 'ifl_pct', sortAsc: false,
      pctFmt: fmtPct, note: 'Доля активных агентов-ИФЛ от общего числа активных агентов.'
    };
    case 'nonauto': return {
      pctLabel: 'Доля не-авто', pctField: 'nonauto_pct', scoreField: 'nonauto_score',
      sortField: 'nonauto_pct', sortAsc: true,
      pctFmt: fmtPct, note: 'Доля продуктов не-Авто в портфеле. Сортировка по возрастанию (низкая доля — требует внимания).'
    };
    case 'prol': return {
      pctLabel: 'Пролонгация Авто', pctField: 'prol_pct', scoreField: 'prol_score',
      sortField: 'prol_pct', sortAsc: false,
      pctFmt: fmtPct, note: 'Пролонгация ОСАГО+КАСКО: доля продлённых договоров от числа окончившихся.'
    };
    case 'cov': return {
      pctLabel: 'Охват', pctField: 'cov_pct', scoreField: 'cov_score',
      sortField: 'cov_pct', sortAsc: false,
      pctFmt: fmtPct, note: 'Охват агентов по ОСАГО+КАСКО.'
    };
    case 'active': return null; // special render
    case 'dz': return null; // special render
  }
}

function renderTab(tabId) {
  const d = getData();
  const isMag = currentSection === 'mag';

  if (tabId === 'overall') return renderOverall(d, isMag);
  if (tabId === 'wp') return renderWP(d);
  if (tabId === 'active') return renderActive(d);
  if (tabId === 'dz') return renderDZ(d);

  const cfg = getTabConfig(tabId);
  if (!cfg) return '<p>Нет данных</p>';

  let note = cfg.note ? `<div class="lower-note">${cfg.note}</div>` : '';
  const sorted = sortData(d, cfg.sortField, cfg.sortAsc);
  let th = `<th>#</th><th>Участник</th>` + contextTh();
  th += `<th class="r">${cfg.pctLabel}</th><th class="c">Балл</th>`;

  let rows = '';
  sorted.forEach((r,i) => {
    let td = `<td class="c">${placeHtml(i+1)}</td><td class="person-name">${r.name}</td>` + contextTd(r);
    const pv = r[cfg.pctField];
    const sv = r[cfg.scoreField];
    td += `<td class="r pct">${cfg.pctFmt(pv)}</td>`;
    td += `<td class="score bold-score ${scClass(sv)}">${sv!==null&&sv!==undefined?sv:'—'}</td>`;
    rows += `<tr>${td}</tr>`;
  });
  return note + `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function getTabs() {
  return currentSection === 'mag' ? TABS_MAG : TABS_OTV_DA;
}

function getTabTitle(tabId) {
  const tabs = getTabs();
  const t = tabs.find(x => x.id === tabId);
  return t ? t.label : '';
}

function renderMethodBar() {
  const methods = currentSection === 'mag' ? METHODS_MAG : METHODS_OTV;
  const chips = methods.map(([n,w]) => `<span class="method-chip"><strong>${w}</strong> ${n}</span>`).join('');
  document.getElementById('method-bar').innerHTML = `<span class="method-label">Веса:</span>${chips}`;
}

function renderTabsNav() {
  const tabs = getTabs();
  const nav = tabs.map(t =>
    `<button class="tab-btn${t.id===currentTab?' active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');
  document.getElementById('tabs-nav').innerHTML = nav;
}

function renderContent() {
  const d = getData();
  const tableHtml = renderTab(currentTab);
  const legend = `<div class="legend">
    <span style="font-size:11px;color:#888;font-weight:600">Балл:</span>
    <div class="legend-item"><div class="legend-dot" style="background:#bbb"></div>0</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>1–25</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>50–75</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--primary)"></div>100</div>
  </div>`;
  document.getElementById('content').innerHTML = `
    <div class="panel-title">${getTabTitle(currentTab)}</div>
    <div class="panel-sub">${d.length} участников · Апрель 2026</div>
    ${currentTab==='overall'?legend:''}
    <div class="table-wrap">${tableHtml}</div>`;
}

function updateHeroStats() {
  const d = getData();
  const sorted = sortData(d, 'total', false);
  document.getElementById('stat-count').textContent = d.length;
  document.getElementById('stat-lbl').textContent = 'участников';
  document.getElementById('stat-leader').textContent = sorted[0]?.name?.split(' ')[0] || '—';
  document.getElementById('stat-leader-lbl').textContent = 'лидер · ' + (sorted[0]?.total?.toFixed(1)||'') + ' б.';
  const top3 = sorted.slice(0,3);
  const avg3 = top3.length ? (top3.reduce((s,r)=>s+(r.total||0),0)/top3.length).toFixed(1) : '—';
  document.getElementById('stat-top').textContent = avg3;
}

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  if (currentSection === 'otv') { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  let html = '';

  if (currentSection === 'da') {
    const otvs = [...new Set(DATA.da.map(r => r.otv))].sort();
    html += `<span class="section-lbl">Ответственный:</span>`;
    html += `<select class="filter-select" onchange="setOtv(this.value)">`;
    html += `<option value="all">Все (${DATA.da.length})</option>`;
    otvs.forEach(o => html += `<option value="${o}" ${currentOtv===o?'selected':''}>${o}</option>`);
    html += `</select>`;
    const byOtvDA = currentOtv==='all' ? DATA.da : DATA.da.filter(r=>r.otv===currentOtv);
    const branchesDA = [...new Set(byOtvDA.map(r => r.branch).filter(Boolean))].sort();
    html += `<span class="section-lbl">Филиал:</span>`;
    html += `<select class="filter-select" onchange="setBranch(this.value)">`;
    html += `<option value="all">Все</option>`;
    branchesDA.forEach(b => html += `<option value="${b}" ${currentBranch===b?'selected':''}>${b}</option>`);
    html += `</select>`;
  }

  if (currentSection === 'mag') {
    const mag = DATA.mag;
    // Category pills
    html += `<span class="section-lbl">Категория:</span>`;
    [['all','Все',mag.length],['1. От 25 млн','От 25 млн',mag.filter(r=>r.category==='1. От 25 млн').length],
     ['2. От 10 до 25 млн','10–25 млн',mag.filter(r=>r.category==='2. От 10 до 25 млн').length],
     ['3. до 10 млн','до 10 млн',mag.filter(r=>r.category==='3. до 10 млн').length]
    ].forEach(([v,l,n]) => {
      html += `<button class="cat-btn${currentCat===v?' active':''}" onclick="setCat('${v}')">${l} <span class="cat-count">(${n})</span></button>`;
    });
    html += `<span class="filter-sep">|</span>`;
    // OTV dropdown (filtered by cat)
    const byCat = currentCat==='all' ? mag : mag.filter(r=>r.category===currentCat);
    const otvs = [...new Set(byCat.map(r => r.otv))].sort();
    html += `<span class="section-lbl">Ответственный:</span>`;
    html += `<select class="filter-select" onchange="setOtv(this.value)">`;
    html += `<option value="all">Все</option>`;
    otvs.forEach(o => html += `<option value="${o}" ${currentOtv===o?'selected':''}>${o}</option>`);
    html += `</select>`;
    // Branch dropdown (filtered by cat + otv)
    const byOtv = currentOtv==='all' ? byCat : byCat.filter(r=>r.otv===currentOtv);
    const branches = [...new Set(byOtv.map(r => r.branch).filter(Boolean))].sort();
    html += `<span class="section-lbl">Филиал:</span>`;
    html += `<select class="filter-select" onchange="setBranch(this.value)">`;
    html += `<option value="all">Все</option>`;
    branches.forEach(b => html += `<option value="${b}" ${currentBranch===b?'selected':''}>${b}</option>`);
    html += `</select>`;
    // KP dropdown (filtered by cat + otv + branch)
    const byBranch = currentBranch==='all' ? byOtv : byOtv.filter(r=>r.branch===currentBranch);
    const kps = [...new Set(byBranch.map(r => r.kp))].sort();
    html += `<span class="section-lbl">Код КП:</span>`;
    html += `<select class="filter-select" onchange="setKp(this.value)">`;
    html += `<option value="all">Все</option>`;
    kps.forEach(k => html += `<option value="${k}" ${currentKp===k?'selected':''}>${k}</option>`);
    html += `</select>`;
  }

  bar.innerHTML = html;
}

function setSection(sec) {
  currentSection = sec;
  currentTab = 'overall';
  currentOtv = 'all'; currentBranch = 'all'; currentKp = 'all'; currentCat = 'all';
  document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderMethodBar();
  renderFilterBar();
  renderTabsNav();
  updateHeroStats();
  renderContent();
}

function setTab(tabId) {
  currentTab = tabId;
  renderTabsNav();
  renderContent();
}

function setCat(cat) {
  currentCat = cat;
  currentOtv = 'all'; currentBranch = 'all'; currentKp = 'all';
  renderFilterBar();
  updateHeroStats();
  renderContent();
}

function setOtv(otv) {
  currentOtv = otv;
  currentBranch = 'all'; currentKp = 'all';
  renderFilterBar();
  updateHeroStats();
  renderContent();
}

function setBranch(branch) {
  currentBranch = branch;
  currentKp = 'all';
  renderFilterBar();
  updateHeroStats();
  renderContent();
}

function setKp(kp) {
  currentKp = kp;
  renderFilterBar();
  updateHeroStats();
  renderContent();
}

// Init
renderMethodBar();
renderFilterBar();
renderTabsNav();
updateHeroStats();
renderContent();
</script>
</body>
</html>
